<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Club BD</title>
  <style>
    :root {
      --primary: #1565c0;
      --primary-dark: #0d47a1;
      --primary-light: #90caf9;
      --bg: #f5f9fc;
      --box: #ffffff;
      --label: #e3f2fd;
      --text: #1a1a1a;
      --text-soft: #333333;
      --text-muted: #555555;
      --border: #90caf9;
      --input-bg: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: var(--text);
    }
    #loadingOverlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      backdrop-filter: blur(5px);
      flex-direction: column;
      gap: 16px;
    }
    #loadingOverlay.show { display: flex; }
    .loader {
      width: 52px; height: 52px;
      border: 5px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .loading-text {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loginScreen {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; justify-content: center; align-items: center; z-index: 9999;
    }
    .login-box {
      background: var(--box);
      padding: 36px 32px; border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
      width: 100%; max-width: 370px; text-align: center;
      border: 1.5px solid var(--border);
    }
    .login-logo {
      width: 58px; height: 58px; background: var(--primary);
      border-radius: 14px; margin: 0 auto 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; color: #fff; font-weight: 800;
    }
    .login-box h2 { font-size: 18px; margin-bottom: 2px; color: var(--text); font-weight: 700; }
    .login-box .sub { font-size: 11px; color: var(--text-muted); margin-bottom: 20px; }
    .login-input {
      width: 100%; padding: 12px 14px; margin-bottom: 11px;
      border: 1.5px solid var(--border); border-radius: 10px; font-size: 14px;
      outline: none; background: var(--input-bg); color: var(--text);
    }
    .login-input:focus { border-color: var(--primary); }
    .remember-row {
      display: flex; align-items: center; gap: 8px; margin: 4px 0 14px;
      font-size: 13px; color: var(--text-soft); cursor: pointer;
    }
    .remember-row input { width: 15px; height: 15px; accent-color: var(--primary); }
    .login-btn {
      width: 100%; padding: 13px; background: var(--primary);
      color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    .login-btn:hover { background: var(--primary-dark); }
    .login-error { color: #c62828; font-size: 13px; margin-top: 11px; display: none; font-weight: 600; }
    .switch-mode { margin-top: 16px; font-size: 13px; color: var(--text-muted); }
    .switch-mode span { color: var(--primary); font-weight: 700; cursor: pointer; }
    #signupBox { display: none; }

    .header {
      background: var(--box); text-align: center; padding: 9px 14px;
      border-bottom: 2px solid var(--border); position: relative; flex-shrink: 0;
    }
    .header h2 { margin: 0; font-size: 16px; font-weight: 700; display: inline; color: var(--text); }
    .header .ext { font-size: 11px; font-weight: 600; color: var(--primary); margin-left: 6px; }
    .menu-btn {
      position: absolute; left: 12px; top: 8px;
      background: var(--label); border: 1.5px solid var(--border); border-radius: 6px;
      font-size: 17px; cursor: pointer; padding: 2px 9px; color: var(--text);
    }
    .header-right {
      position: absolute; right: 12px; top: 7px;
      display: flex; align-items: center; gap: 7px;
    }
    .user-info { font-size: 12px; font-weight: 600; color: var(--text-soft); }
    .logout-btn, .refresh-btn {
      border: none; padding: 6px 12px; border-radius: 6px;
      font-weight: 600; cursor: pointer; font-size: 12px;
    }
    .logout-btn { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .refresh-btn { background: var(--primary); color: #fff; }

    .sidebar {
      position: fixed; left: -270px; top: 0; width: 270px; height: 100%;
      background: var(--primary-dark); transition: 0.3s; z-index: 1000;
    }
    .sidebar.open { left: 0; }
    .sidebar-header {
      padding: 15px 18px; font-size: 15px; color: #fff; font-weight: 600;
      display: flex; justify-content: space-between; align-items: center;
    }
    .close-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
    .menu-item {
      padding: 13px 18px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.12);
      cursor: pointer; font-size: 14px;
    }
    .menu-item:hover { background: rgba(0,0,0,0.2); }

    .content-area { flex-grow: 1; padding: 10px 12px; overflow: hidden; width: 100%; }
    .view-section { display: none; width: 100%; height: 100%; overflow: hidden; }
    .view-section.active { display: flex; }
    #entryView { flex-direction: row; gap: 10px; }
    .left-panel { width: 42%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; padding-right: 4px; }
    .right-panel { width: 58%; height: 100%; display: flex; flex-direction: column; overflow-y: auto; padding-left: 10px; border-left: 1.5px solid var(--border); }
    #reportView, #userView, #themeView { flex-direction: column; overflow-y: auto; }

    .section-title {
      font-weight: 700; margin-bottom: 7px; font-size: 13.5px;
      border-bottom: 1.5px solid var(--border); padding-bottom: 4px; color: var(--text);
    }
    .box {
      background: var(--box); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 11px; margin-bottom: 10px;
    }
    .row {
      display: flex; margin-bottom: 6px; border: 1.5px solid var(--border);
      border-radius: 7px; overflow: hidden;
    }
    .row label {
      width: 36%; background: var(--label); padding: 8px 10px;
      font-size: 12px; font-weight: 600; border-right: 1.5px solid var(--border);
      display: flex; align-items: center; color: var(--text);
    }
    .row input, .row select {
      width: 64%; border: none; padding: 8px 10px; font-size: 13px;
      outline: none; background: var(--input-bg); color: var(--text);
    }
    .row input[readonly] { background: var(--input-bg); color: var(--text-muted); font-style: italic; }
    .row select:disabled { background: var(--input-bg); color: var(--text-muted); cursor: not-allowed; }

    .btn {
      width: 100%; padding: 10px; font-size: 13px; font-weight: 600;
      border: none; border-radius: 7px; cursor: pointer; color: #fff; margin-top: 5px;
    }
    .btn-green { background: #2e7d32; }
    .btn-red { background: var(--primary); }
    .btn-toggle { background: var(--label); color: var(--text); border: 1.5px solid var(--border); font-size: 12px; }
    .btn-clear { background: #607d8b; }
    .btn-delete { background: #c62828; margin-top: 6px; }

    .summary-row {
      display: flex; border: 1.5px solid var(--border); border-radius: 7px;
      overflow: hidden; margin-bottom: 7px;
    }
    .summary-row div {
      width: 55%; background: var(--label); padding: 8px;
      font-weight: 600; font-size: 12px; color: var(--text);
    }
    .summary-row .val {
      width: 45%; background: var(--box); text-align: center;
      border-left: 1.5px solid var(--border); font-weight: 700; font-size: 13px; color: var(--text);
    }

    .live-summary {
      background: var(--box); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 12px; margin-bottom: 10px;
    }
    .live-summary .title { font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .live-summary .total { font-size: 20px; font-weight: 800; color: var(--text); margin: 4px 0 8px; }
    .prog-item {
      font-size: 12px; padding: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.08);
      color: var(--text-soft);
    }
    .prog-item:last-child { border-bottom: none; }
    .prog-item .prog-name { font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .prog-item .prog-weights { font-size: 12px; }

    table {
      width: 100%; border-collapse: collapse; text-align: center;
      border: 1.5px solid var(--border); margin-bottom: 8px; font-size: 11px;
    }
    th { background: var(--label); padding: 6px 2px; border: 1px solid var(--border); font-weight: 600; color: var(--text); }
    td { padding: 5px 2px; border: 1px solid var(--border); font-weight: 600; background: var(--box); color: var(--text); }

    #updateFormWrapper { display: none; }
    .search-flex { display: flex; gap: 6px; margin-bottom: 7px; align-items: center; flex-wrap: wrap; }
    .search-flex input, .search-flex select {
      padding: 7px; border: 1.5px solid var(--border); border-radius: 6px;
      font-size: 12px; background: var(--input-bg); color: var(--text);
    }

    .msg {
      font-size: 12px; padding: 7px 10px; border-radius: 6px;
      margin-top: 6px; display: none; font-weight: 600;
    }
    .msg-success { background: #e8f5e9; color: #2e7d32; }
    .msg-error { background: #ffebee;
